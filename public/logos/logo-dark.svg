<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 78" fill="none">
  <!-- Kozijn mark: a clean four-pane window frame -->
  <rect x="2" y="15" width="46" height="46" rx="3" stroke="#141917" stroke-width="3"/>
  <line x1="25" y1="15" x2="25" y2="61" stroke="#141917" stroke-width="3"/>
  <line x1="2" y1="38" x2="48" y2="38" stroke="#00a66e" stroke-width="3"/>
  <!-- Wordmark -->
  <text x="64" y="33" font-family="Montserrat,system-ui,sans-serif" font-weight="800" font-size="19" letter-spacing="0.5" fill="#141917">KUNSTSTOF</text>
  <text x="64" y="56" font-family="Montserrat,system-ui,sans-serif" font-weight="800" font-size="19" letter-spacing="0.5"><tspan fill="#00a66e">KOZIJN</tspan><tspan fill="#141917">NODIG</tspan><tspan fill="#00a66e">.NL</tspan></text>
  <!-- Green rule + slogan -->
  <line x1="64" y1="64" x2="315" y2="64" stroke="#00a66e" stroke-width="1.5"/>
  <text x="64" y="75" font-family="Montserrat,system-ui,sans-serif" font-weight="600" font-size="8.5" letter-spacing="3.2" fill="#141917" opacity="0.6">KWALITEIT IN KUNSTSTOF KOZIJNEN</text>
</svg>
